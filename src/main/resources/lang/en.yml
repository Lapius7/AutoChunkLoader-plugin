# AutoChunkLoader English (MiniMessage)
prefix: '<gradient:#4ade80:#22d3ee><b>ACL</b></gradient> <dark_gray>»</dark_gray> '
mark:
  ok: '<green>✔</green> '
  err: '<red>✘</red> '
owner:
  console: 'Console'

ui:
  rule: '<dark_gray>━━━━━</dark_gray> <gradient:#4ade80:#22d3ee><title></gradient> <dark_gray>━━━━━━━━━━━━━━</dark_gray>'
  rule-end: '<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
  indent: '<dark_gray> ▸ </dark_gray>'

row: '<dark_gray> │</dark_gray> <gray><k></gray> <dark_gray>:</dark_gray> <white><v></white>'

lbl:
  world: 'World'
  range: 'Range'
  block-range: 'Block range'
  center: 'Center'
  owner: 'Owner'
  created: 'Created'
  level: 'Load level'
  tickets: 'Tickets'
  status: 'Status'
  spawn: 'Natural spawning'
  randomtick: 'Random ticks'

level:
  inaccessible: 'INACCESSIBLE'
  border: 'BORDER'
  ticking: 'TICKING'
  entity_ticking: 'ENTITY_TICKING'
  unloaded: 'UNLOADED'
  fmt:
    inaccessible: '<red><level></red>'
    border: '<gold><level></gold>'
    ticking: '<yellow><level></yellow>'
    entity_ticking: '<green><level></green>'
    unloaded: '<dark_gray><level></dark_gray>'

btn:
  help: '<gray>[</gray><aqua>Help</aqua><gray>]</gray>'
  info: '<gray>[</gray><aqua>info</aqua><gray>]</gray>'
  remove: '<gray>[</gray><red>delete</red><gray>]</gray>'
  remove-named: '<gray>[</gray><red>delete: <name></red><gray>]</gray>'
  confirm: '<gray>[</gray><red><b>Really delete</b></red><gray>]</gray>'
  add-here: '<gray>[</gray><green>Add this chunk</green><gray>]</gray>'
  add-sel: '<gray>[</gray><green>Add selection</green><gray>]</gray>'
  inspector: '<gray>[</gray><yellow>outline</yellow><gray>]</gray>'
  grow: '<gray>[</gray><green>+1</green><gray>]</gray>'
  shrink: '<gray>[</gray><gold>-1</gold><gray>]</gray>'
  rename: '<gray>[</gray><light_purple>rename</light_purple><gray>]</gray>'
  remove-chunk: '<gray>[</gray><gold>remove this chunk</gold><gray>]</gray>'
  remove-chunk-named: '<gray>[</gray><gold>remove from: <name></gold><gray>]</gray>'
  add-chunk: '<gray>[</gray><green>add to a group</green><gray>]</gray>'
  chunk-add: '<gray>[</gray><green>+chunk</green><gray>]</gray>'
  chunk-remove: '<gray>[</gray><gold>-chunk</gold><gray>]</gray>'
  sw-on: '<gray>[</gray><green>ON</green><gray>]</gray>'
  undo: '<gray>[</gray><yellow>undo</yellow><gray>]</gray>'
  redo: '<gray>[</gray><aqua>redo</aqua><gray>]</gray>'
  sw-off: '<gray>[</gray><red>OFF</red><gray>]</gray>'
  sw-on-cur: '<green><b>[ON]</b></green>'
  sw-off-cur: '<red><b>[OFF]</b></red>'
  prev: '<gray>[</gray><aqua>◀ prev</aqua><gray>]</gray>'
  next: '<gray>[</gray><aqua>next ▶</aqua><gray>]</gray>'
  prev-off: '<dark_gray>[◀ prev]</dark_gray>'
  next-off: '<dark_gray>[next ▶]</dark_gray>'

hover:
  help: '<aqua>Show all commands</aqua>'
  info: '<aqua>Show group details</aqua>'
  remove: '<red>Delete the group (asks first if it has several chunks)</red>'
  confirm: '<red>Click to delete</red>'
  add-here: '<green>Register the chunk you are standing in</green>'
  add-sel: '<green>Register the pos1-pos2 area</green>'
  inspector: '<yellow>Toggle the edge outline of kept chunks</yellow>'
  undo: '<yellow>Undo your last change (groups, chunks, switches)</yellow>'
  redo: '<aqua>Redo the change you just undid</aqua>'
  grow: '<green>Grow by 1 chunk on every side</green>'
  shrink: '<gold>Shrink by 1 chunk on every side</gold>'
  rename: '<light_purple>Put the rename command in the chat box</light_purple>'
  remove-chunk: '<gold>Take only this chunk out of the group</gold>'
  add-chunk: '<green>Type a group name to add this chunk to it</green>'
  chunk-add: '<green>Add the chunk you are in to this group</green>'
  chunk-remove: '<gold>Remove the chunk you are in from this group</gold>'
  spawn-on: '<green>Turn natural spawning ON for this group</green>'
  spawn-off: '<red>Turn natural spawning OFF for this group</red>'
  randomtick-on: '<green>Turn random ticks ON for this group</green>'
  randomtick-off: '<red>Turn random ticks OFF for this group</red>'
  prev: '<aqua>Previous page</aqua>'
  next: '<aqua>Next page</aqua>'
  suggest: '<gray>Click to put it in the chat box</gray>'

ok:
  added: 'Added <white><name></white> <dark_gray>(<chunks> chunks / <world>)</dark_gray>'
  removed: 'Removed <white><name></white> and released its tickets <dark_gray>(<chunks> chunks)</dark_gray>'
  resized: 'Resized <white><name></white> to <white><w>×<d></white> <dark_gray>(<chunks> chunks)</dark_gray>'
  expanded: 'Expanded <white><name></white> to include this chunk <dark_gray>(<w>×<d> / <chunks> chunks)</dark_gray>'
  renamed: 'Renamed <white><old></white> → <white><name></white>'
  spawn-on: 'Natural spawning <green>ON</green> for <white><name></white>'
  spawn-off: 'Natural spawning <red>OFF</red> for <white><name></white>'
  spawn-all-on: 'Natural spawning <green>ON</green> for <white><n></white> group(s)'
  spawn-all-off: 'Natural spawning <red>OFF</red> for <white><n></white> group(s)'
  randomtick-on: 'Random ticks <green>ON</green> for <white><name></white>'
  randomtick-off: 'Random ticks <red>OFF</red> for <white><name></white> <dark_gray>(crops, grass, ice and so on stop; chunks, entities, hoppers and redstone keep running)</dark_gray>'
  randomtick-all-on: 'Random ticks <green>ON</green> for <white><n></white> group(s)'
  randomtick-all-off: 'Random ticks <red>OFF</red> for <white><n></white> group(s)'
  pos1: 'pos1 set to <white>(<x>, <z>)</white>'
  pos2: 'pos2 set to <white>(<x>, <z>)</white>'
  inspector-on: 'Outline <green>ON</green>. Only you can see the edges of kept chunks (<white>inspector.mode</white> in config.yml: edges / full)'
  inspector-off: 'Outline <red>OFF</red>'
  inspector-forced: '<gray>An admin has forced the outline on for everyone, so it stays visible</gray>'
  inspectorall-on: 'Outline forced <green>ON</green> for all online players (also after reconnect and restart). Turn off with <white>/acl inspectorall off</white>'
  inspectorall-off: 'Forced outline <red>OFF</red>. Players who turned on their own outline with <white>/acl i</white> still see it'
  reloaded: 'Config and language files reloaded'
  undone: 'Undid <white><cmd></white> <dark_gray>(<left> more to undo)</dark_gray>'
  redone: 'Redid <white><cmd></white> <dark_gray>(<left> more to redo)</dark_gray>'
  chunk-added: 'Added chunk <white>(<x>, <z>)</white> to <white><name></white> <dark_gray>(<chunks> chunks now)</dark_gray>'
  chunk-removed: 'Removed chunk <white>(<x>, <z>)</white> from <white><name></white> <dark_gray>(<chunks> chunks left)</dark_gray>'
  chunk-removed-last: 'Chunk <white>(<x>, <z>)</white> was the last one, so <white><name></white> was deleted'
  split: '<gold>The group is now <regions> separate regions</gold>'

err:
  unknown-sub: '<red>Unknown subcommand: <sub></red>'
  no-permission: '<red>You do not have permission</red>'
  undo-empty: '<red>Nothing to undo</red>'
  redo-empty: '<red>Nothing to redo</red>'
  undo-stale: '<red>That button is for an older change; only your latest change can be undone or redone</red>'
  undo-gone: '<red>Cannot: group <white><name></white> no longer exists (changed by something else)</red>'
  undo-changed: '<red>Cannot: group <white><name></white> was changed by something else since</red>'
  undo-exists: '<red>Cannot: a group named <white><name></white> exists now</red>'
  player-only: '<red>Run this as a player</red>'
  no-such-group: '<red>No group named <name></red>'
  not-owner: '<red><name> is not your group</red>'
  not-a-number: '<red>Invalid <what>: <value></red>'
  relative-needs-player: '<red>~ only works for players</red>'
  bad-name: '<red>Names use letters, digits, - and _ only (1-32 chars, at least one letter)</red>'
  name-taken: '<red>The name <name> is already used</red>'
  reserved-name: '<red><name> clashes with a command name</red>'
  no-such-world: '<red>World <world> not found</red>'
  sel-missing: '<red>Set two points with /acl pos1 and /acl pos2 first</red>'
  sel-world: '<red>pos1 and pos2 are in different worlds</red>'
  console-world: '<red>The console must give a world (add <name> <x> <z> <radius> <world>)</red>'
  add-usage: '<red>Usage: /acl add [name] [radius] | /acl add <name> <x> <z> [radius] [world] | /acl add <name> <x1> <y1> <z1> <x2> <y2> <z2> [world] | /acl add <name> sel</red>'
  out-of-range: '<red>Coordinates are outside the world</red>'
  negative: '<red>Invalid value (radius must be 0 or more, amount must not be 0)</red>'
  radius-limit: '<red>Max radius is <max></red>'
  group-limit: '<red>One group may hold at most <max> chunks (this one: <chunks>)</red>'
  total-limit: '<red>Would exceed the server-wide limit of <max> chunks (now <now>)</red>'
  player-limit: '<red>You can own at most <max> groups</red>'
  not-registered-here: '<red>This chunk is not in any group</red>'
  usage: '<red>Usage: <usage></red>'
  too-small: '<red>Cannot shrink any further</red>'
  other-world: '<red>That group is in another world</red>'
  chunk-usage: '<red>Usage: /acl remove here | /acl remove chunk [name] [x z], /acl add here <name> | /acl add chunk <name> [x z]</red>'
  add-chunk-usage: '<red>A group name is required (e.g. /acl add here <name>)</red>'
  chunk-already-in: '<red>Chunk (<x>, <z>) is already in <name></red>'
  chunk-not-in: '<red>Chunk (<x>, <z>) is not in <name></red>'

here:
  title: 'Chunk <x>, <z>'
  no-tickets: 'none'
  unregistered: '<gray>not registered</gray>'
  registered: '<green>registered</green>'
  group: '<white><name></white> <dark_gray>(<chunks> chunks)</dark_gray>'

remove:
  pick: 'This chunk is in several groups. Pick one to delete'
  pick-chunk: 'That chunk is in several groups. Pick the one to remove it from'
  confirm: 'Delete <white><name></white> (<chunks> chunks)?'

list:
  empty: '<gray>No groups yet. Use <white>/acl add</white> to register the chunk you are in</gray>'
  title: 'Groups <dark_gray>(<count> / <chunks> chunks)</dark_gray>'
  row: '<white><name></white> <dark_gray>[<world> (<x>, <z>) <w>×<d>=<chunks>]</dark_gray>'
  row-inactive: '<gray><name></gray> <dark_gray>[<world> not loaded]</dark_gray>'
  row-shape: '<white><name></white> <dark_gray>[<world> (<x>, <z>) <chunks> chunks, bbox <w>×<d>]</dark_gray>'
  footer: '<dark_gray> </dark_gray><prev> <gray><page>/<pages></gray> <next>'

info:
  spawn-on: '<green>ON</green>'
  spawn-off: '<gray>OFF</gray>'
  randomtick-unavailable: '<red>unavailable (this server does not match Paper 26.3)</red>'
  spawn-disabled: '<red>disabled in config (spawn.enabled)</red>'
  title: '<name>'
  world-missing: '(not loaded)'
  range: 'chunks <x1>,<z1> to <x2>,<z2> <dark_gray>(<w>×<d> = <chunks>)</dark_gray>'
  level-count: '<level> <dark_gray><n>/<total></dark_gray>'
  range-shape: 'bounding box <x1>,<z1> to <x2>,<z2> <dark_gray>(<w>×<d>, actually <chunks> chunks / <regions> regions)</dark_gray>'
  inactive: '<red>No tickets held (world not loaded)</red>'

pos:
  ready: '<gray>Both points set</gray>'

help:
  title: 'AutoChunkLoader <dark_gray>v<version></dark_gray>'
  row: '<aqua><cmd></aqua> <dark_gray>-</dark_gray> <gray><desc></gray>'
  cmd:
    here: '/acl here'
    add: '/acl add [name] [radius]'
    add-range: '/acl add <name> <x1> <y1> <z1> <x2> <y2> <z2>'
    remove: '/acl remove [name]'
    remove-chunk: '/acl remove here | chunk [name] [x z]'
    add-chunk: '/acl add here <name> | chunk <name> [x z]'
    list: '/acl list [page]'
    info: '/acl info [name]'
    resize: '/acl resize <name> <+n|-n>'
    expand: '/acl expand [name]'
    rename: '/acl rename <old> <new>'
    spawn: '/acl spawn <name|all> [on|off]'
    randomtick: '/acl randomtick <name|all> [on|off]'
    pos: '/acl pos1 | pos2'
    inspector: '/acl inspector (i)'
    inspectorall: '/acl inspectorall [on|off] (iall)'
    reload: '/acl reload'
  desc:
    here: 'State of this chunk (registered, groups, load level)'
    add: 'Register this chunk (name optional, auto-named)'
    add-range: 'Two block positions -> one group (~ ok, y ignored, "sel" uses pos1/pos2)'
    remove: 'Delete a group (no name = the one here)'
    remove-chunk: 'Take this / the given chunk out of a group (empty = deleted, may split)'
    add-chunk: 'Add this / the given chunk to an existing group'
    list: 'List groups (click info / delete)'
    info: 'Group details'
    resize: 'Grow / shrink by n chunks on every side'
    expand: 'Grow to include this chunk'
    rename: 'Rename a group'
    spawn: 'Toggle vanilla natural spawning in a group, even with no player nearby (all = every group; all alone lists them)'
    randomtick: 'Toggle random ticks (crop growth, grass spread, ice melt...) in a group (default ON; all = every group)'
    pos: 'Set a selection corner at your position'
    inspector: 'Show only the edges of kept chunks (only you; inspector.mode: edges / full)'
    inspectorall: 'Force the outline on for every online player (admin; saved across restarts; far-away players get nothing drawn)'
    reload: 'Reload config and language files'

toggles:
  spawn-title: 'Natural spawning (<count> groups)'
  randomtick-title: 'Random ticks (<count> groups)'
  row: '<white><name></white> <dark_gray>(<world>)</dark_gray> <state>'
  empty: '<gray>No groups yet</gray>'
  state-on: '<green>ON</green>'
  state-off: '<red>OFF</red>'
