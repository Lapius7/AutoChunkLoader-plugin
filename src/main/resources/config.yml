# AutoChunkLoader
# Language: ja / en (edit plugins/AutoChunkLoader/lang/<code>.yml to customize)
language: ja

limits:
  max-radius: 4            # max radius for center+radius groups; size is (2r+1)^2
  max-chunks-per-group: 100
  max-chunks-total: 200    # whole-server cap on kept chunks
  max-groups-per-player: 5

# Natural mob spawning for groups with `/acl spawn <group> on` (default off per group).
# Vanilla spawning (biome mobs, light, spawn interval, mob cap) runs in the group's chunks even when no
# player is within 128 blocks, and mobs there are kept from despawning. It works in every dimension,
# also when nobody is in that world. Chunks that have a player nearby are left to vanilla.
spawn:
  enabled: true            # false = feature off for everyone

inspector:
  mode: edges              # edges = only the outline edges (top/bottom lines + corner pillars); full = rings and posts over the whole wall
  radius: 6                # chunks around the player to draw
  height: 16               # draws +-height blocks around eye level
  interval-ticks: 5
  step: 0.5                # particle spacing in blocks (near; widens with distance)
  ring-spacing: 2          # full mode only: vertical distance between horizontal lines
  post-spacing: 8          # full mode only: a vertical line every N blocks along an edge (corners always have one)
  falloff: 24              # blocks over which the spacing doubles (far = sparse)
  max-particles: 1500      # per update per player; edges are thinned above this, corners never
  all-max-particles: 600   # per update per player for players shown only by /acl inspectorall (lighter than max-particles)
  color: "#ffa200"         # edges
  size: 1.6                # edge particle size (0.3-4)
  corner-color: "#ff1f6d"
  corner-size: 2.4

list:
  page-size: 8
